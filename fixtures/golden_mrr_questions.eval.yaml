apiVersion: knowledgecatalog.googleapis.com/v1alpha1
kind: SemanticBenchmarkSuite
metadata:
  name: golden-mrr-questions
  contextSet: projects/opm-looker-core-demo-instance/locations/us-central1/entryGroups/sales-analytics
  semanticModel: revenue_retention
spec:
  nonRegressionGate: 1.00
  cases:
    - id: GQ-01
      title: "Regional Net Revenue Retention (NRR) across AMER, APAC, and EMEA (260 MRR events)"
      question: "What is our certified Net Revenue Retention (NRR) by sales region after accounting for expansion, contraction, and churn?"
      certifiedMetrics:
        - MrrMovement.net_revenue_retention
        - MrrMovement.total_starting_mrr
      preHealSql: |
        SELECT
          a.region,
          ROUND(
            (SUM(m.start_mrr_usd) + SUM(m.expansion_mrr_usd) - SUM(m.churned_mrr_usd))
            / NULLIF(SUM(m.start_mrr_usd), 0),
            4
          ) AS net_revenue_retention
        FROM `opm-looker-core-demo-instance.sales_analytics_demo.fct_mrr_movements` AS m
        JOIN `opm-looker-core-demo-instance.sales_analytics_demo.tbl_subscriptions` AS s
          ON m.sub_id = s.sub_id
        JOIN `opm-looker-core-demo-instance.sales_analytics_demo.tbl_accounts_v2` AS a
          ON m.acc_id = a.acc_id
        GROUP BY a.region
        ORDER BY a.region
      postHealSql: |
        SELECT
          a.region,
          ROUND(
            (SUM(m.opening_mrr_usd) + SUM(m.expansion_mrr_usd) - SUM(m.contraction_mrr_usd) - SUM(m.churned_mrr_usd))
            / NULLIF(SUM(m.opening_mrr_usd), 0),
            4
          ) AS net_revenue_retention
        FROM `opm-looker-core-demo-instance.sales_analytics_demo.fct_mrr_movements` AS m
        JOIN `opm-looker-core-demo-instance.sales_analytics_demo.tbl_subscriptions` AS s
          ON m.sub_id = s.sub_id
        JOIN `opm-looker-core-demo-instance.sales_analytics_demo.tbl_accounts_v2` AS a
          ON m.acc_id = a.acc_id
        GROUP BY a.region
        ORDER BY a.region
      expectedRows:
        - region: AMER
          net_revenue_retention: 1.0453
          formatted: "104.53%"
        - region: APAC
          net_revenue_retention: 1.0293
          formatted: "102.93%"
        - region: EMEA
          net_revenue_retention: 1.0467
          formatted: "104.67%"

    - id: GQ-02
      title: "Total Net Retained MRR and Contraction Breakdown by Segment & Subscription"
      question: "Show total starting MRR, expansion MRR, contraction MRR, churn MRR, and net retained MRR across Strategic and Enterprise segments."
      certifiedMetrics:
        - MrrMovement.total_starting_mrr
        - MrrMovement.total_expansion_mrr
        - MrrMovement.total_contraction_mrr
        - MrrMovement.total_churn_mrr
        - MrrMovement.net_retained_mrr
      preHealSql: |
        SELECT
          a.segment,
          SUM(m.start_mrr_usd) AS total_starting_mrr,
          SUM(m.expansion_mrr_usd) AS total_expansion_mrr,
          SUM(m.churned_mrr_usd) AS total_churn_mrr,
          SUM(m.start_mrr_usd) + SUM(m.expansion_mrr_usd) - SUM(m.churned_mrr_usd) AS net_retained_mrr
        FROM `opm-looker-core-demo-instance.sales_analytics_demo.fct_mrr_movements` AS m
        JOIN `opm-looker-core-demo-instance.sales_analytics_demo.tbl_subscriptions` AS s
          ON m.sub_id = s.sub_id
        JOIN `opm-looker-core-demo-instance.sales_analytics_demo.tbl_accounts_v2` AS a
          ON m.acc_id = a.acc_id
        GROUP BY a.segment
        ORDER BY a.segment
      postHealSql: |
        SELECT
          a.segment,
          SUM(m.opening_mrr_usd) AS total_starting_mrr,
          SUM(m.expansion_mrr_usd) AS total_expansion_mrr,
          SUM(m.contraction_mrr_usd) AS total_contraction_mrr,
          SUM(m.churned_mrr_usd) AS total_churn_mrr,
          SUM(m.opening_mrr_usd) + SUM(m.expansion_mrr_usd) - SUM(m.contraction_mrr_usd) - SUM(m.churned_mrr_usd) AS net_retained_mrr
        FROM `opm-looker-core-demo-instance.sales_analytics_demo.fct_mrr_movements` AS m
        JOIN `opm-looker-core-demo-instance.sales_analytics_demo.tbl_subscriptions` AS s
          ON m.sub_id = s.sub_id
        JOIN `opm-looker-core-demo-instance.sales_analytics_demo.tbl_accounts_v2` AS a
          ON m.acc_id = a.acc_id
        GROUP BY a.segment
        ORDER BY a.segment
      expectedRows:
        - segment: Enterprise
          total_starting_mrr: 1784475.00
          total_expansion_mrr: 200650.00
          total_contraction_mrr: 20850.00
          total_churn_mrr: 65550.00
          net_retained_mrr: 1898725.00
        - segment: Strategic
          total_starting_mrr: 2016525.00
          total_expansion_mrr: 121500.00
          total_contraction_mrr: 10750.00
          total_churn_mrr: 71200.00
          net_retained_mrr: 2056075.00

    - id: GQ-03
      title: "Company-Wide Portfolio Net Revenue Retention (NRR) across 60 Accounts & 90 Subscriptions"
      question: "What is overall company-wide Net Retained MRR and Net Revenue Retention across all active enterprise accounts and subscriptions?"
      certifiedMetrics:
        - MrrMovement.net_retained_mrr
        - MrrMovement.net_revenue_retention
      preHealSql: |
        SELECT
          SUM(m.start_mrr_usd) AS total_starting_mrr,
          SUM(m.start_mrr_usd) + SUM(m.expansion_mrr_usd) - SUM(m.churned_mrr_usd) AS net_retained_mrr,
          ROUND(
            (SUM(m.start_mrr_usd) + SUM(m.expansion_mrr_usd) - SUM(m.churned_mrr_usd))
            / NULLIF(SUM(m.start_mrr_usd), 0),
            4
          ) AS portfolio_nrr
        FROM `opm-looker-core-demo-instance.sales_analytics_demo.fct_mrr_movements` AS m
      postHealSql: |
        SELECT
          SUM(m.opening_mrr_usd) AS total_starting_mrr,
          SUM(m.opening_mrr_usd) + SUM(m.expansion_mrr_usd) - SUM(m.contraction_mrr_usd) - SUM(m.churned_mrr_usd) AS net_retained_mrr,
          ROUND(
            (SUM(m.opening_mrr_usd) + SUM(m.expansion_mrr_usd) - SUM(m.contraction_mrr_usd) - SUM(m.churned_mrr_usd))
            / NULLIF(SUM(m.opening_mrr_usd), 0),
            4
          ) AS portfolio_nrr
        FROM `opm-looker-core-demo-instance.sales_analytics_demo.fct_mrr_movements` AS m
      expectedRows:
        - total_starting_mrr: 3801000.00
          net_retained_mrr: 3954800.00
          portfolio_nrr: 1.0405
          formatted: "104.05%"
